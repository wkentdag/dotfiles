# Mouse: click to select panes, scroll, resize, and select text.
set -g mouse on

# True color for Vim / Cursor-matching syntax themes in Ghostty.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Pass OSC notifications (Cursor CLI, etc.) through to the outer terminal.
set -g allow-passthrough on

# Cursor CLI uses this to mute notifications when the pane is focused.
set -g focus-events on

